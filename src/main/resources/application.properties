# Server Configuration
server.port=8080

# Application Name
spring.application.name=azentio-rfp-backend

# Database Configuration (Docker PgVector running on port 5433 by default; change to 5432 if using host Postgres)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:azentio_rfp}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Database Initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.continue-on-error=true

# LLM & Embedding Settings
# Can be overridden via environment variables: export OPENAI_API_KEY="your-key"
openai.api.key=${OPENAI_API_KEY:mock}
openai.model-name=${OPENAI_MODEL:gpt-4o-mini}
openai.embedding-model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}

# Actuator & CORS
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
